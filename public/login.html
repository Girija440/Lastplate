<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | LastPlate</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%20%22100%22%20%22100%22><text y=%22.9em%22 font-size=%2290%22>🍽️</text></svg>">
</head>
<body class="auth-page-wrapper">

  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo-badge">LP</div>
      <h1 class="auth-title">Welcome to LastPlate</h1>
      <p class="auth-subtitle">Sign in to check cafeteria stock and reserve meals</p>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="name@college.edu" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.5rem;">
        Sign In
      </button>

      <!-- Demo Credentials Helper Pill -->
      <div style="margin-top: 1.5rem; padding: 1rem; background: var(--color-bg); border: 1px dashed var(--color-lavender); border-radius: var(--radius-sm); text-align: center;">
        <span style="font-size: 0.8rem; font-weight: 700; color: var(--color-dark-purple); display: block; margin-bottom: 0.4rem;">
          🔑 COLLEGE PROJECT DEMO ADMIN
        </span>
        <span style="font-size: 0.82rem; color: var(--color-text-muted); display: block; margin-bottom: 0.6rem;">
          admin@lastplate.com / admin123
        </span>
        <button type="button" id="demo-admin-btn" class="btn btn-violet-subtle btn-sm" style="width: 100%;">
          ⚡ Autofill Admin Login
        </button>
      </div>
    </form>

    <div class="auth-footer">
      Don't have an account yet? <a href="/register.html" style="font-weight: 600;">Register as Student</a>
      <div style="margin-top: 0.75rem;">
        <a href="/index.html" style="font-size: 0.85rem; color: var(--color-text-muted);">← Back to Homepage</a>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
