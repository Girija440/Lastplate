<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration | LastPlate</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%20%22100%22%20%22100%22><text y=%22.9em%22 font-size=%2290%22>🍽️</text></svg>">
</head>
<body class="auth-page-wrapper">

  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo-badge">LP</div>
      <h1 class="auth-title">Create Student Account</h1>
      <p class="auth-subtitle">Join LastPlate to reserve your campus food with zero lines</p>
    </div>

    <form id="register-form">
      <div class="form-group">
        <label class="form-label" for="name">Full Name</label>
        <input type="text" id="name" class="form-control" placeholder="e.g. Alex Johnson" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">College Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="alex@campus.edu" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Create Password</label>
        <input type="password" id="password" class="form-control" placeholder="At least 4 characters" required minlength="4">
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm-password">Confirm Password</label>
        <input type="password" id="confirm-password" class="form-control" placeholder="Repeat your password" required minlength="4">
      </div>

      <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.5rem;">
        Complete Registration
      </button>
    </form>

    <div class="auth-footer">
      Already registered? <a href="/login.html" style="font-weight: 600;">Sign In here</a>
      <div style="margin-top: 0.75rem;">
        <a href="/index.html" style="font-size: 0.85rem; color: var(--color-text-muted);">← Back to Homepage</a>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
